:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;semester-workbench-2026&quot;&gt;
  &lt;style&gt;
    #semester-workbench-2026 {
      color-scheme: light dark;
      --background: light-dark(#f3efe6, #14211f);
      --foreground: light-dark(#172a28, #eee9de);
      --card: light-dark(#fbf8f1, #1b2b28);

      --popover: light-dark(#fbf8f1, #1b2b28);
      --popover-foreground: light-dark(#172a28, #eee9de);
      --primary: light-dark(#17302e, #b9e5d2);
      --primary-foreground: light-dark(#f8f4eb, #14211f);
      --secondary: light-dark(#e8e2d7, #263733);
      --secondary-foreground: light-dark(#213735, #eee9de);
      --muted: light-dark(#e5e0d6, #263733);
      --muted-foreground: light-dark(#667572, #aebbb5);
      --accent: light-dark(#b8e3d2, #315c50);
      --accent-foreground: light-dark(#17302e, #f2eee4);
      --destructive: light-dark(#c75f45, #f1a18b);
      --border: light-dark(#d5cec1, #3b4b46);
      --input: light-dark(#d5cec1, #3b4b46);
      --ring: light-dark(#2a9273, #8ed7bb);
      --blue: light-dark(#477978, #96c9c5);
      --orange: light-dark(#c96f4d, #efac90);
      --green: light-dark(#278d6f, #83d0b3);
      --red: light-dark(#c75f45, #f1a18b);
      --purple: light-dark(#7a6f86, #b9adc5);
      --yellow: light-dark(#a98a42, #d7bd78);
      --viz-series-1: light-dark(#278d6f, #83d0b3);
      --viz-series-2: light-dark(#17302e, #b9e5d2);
      --viz-series-3: light-dark(#c96f4d, #efac90);
      --viz-series-4: light-dark(#477978, #96c9c5);
      --viz-series-5: light-dark(#7a6f86, #b9adc5);
      --viz-series-6: light-dark(#a98a42, #d7bd78);
      color: var(--foreground);
      background: var(--background);
      font-family: inherit;
      padding: 18px;
    }
    #semester-workbench-2026 * { box-sizing: border-box; }
    #semester-workbench-2026 .sw-shell { display: grid; gap: 16px; }
    #semester-workbench-2026 .sw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #semester-workbench-2026 .sw-title { margin: 0; font-weight: 500; }
    #semester-workbench-2026 .sw-sub { margin: 4px 0 0; color: var(--muted-foreground); }
    #semester-workbench-2026 .sw-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    #semester-workbench-2026 .sw-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    #semester-workbench-2026 .sw-stat-label { color: var(--muted-foreground); }
    #semester-workbench-2026 .sw-stat-value { margin-top: 5px; font-weight: 500; }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:first-child { background: light-dark(#17302e, #203532); color: light-dark(#f8f4eb, #f3eee3); }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:first-child .sw-stat-label { color: light-dark(#b8e3d2, #a8d7c5); }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:nth-child(2) { background: light-dark(#b8e3d2, #315c50); color: light-dark(#17302e, #f3eee3); }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:nth-child(2) .sw-stat-label { color: light-dark(#4f7169, #c4ddd3); }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:nth-child(3) { background: light-dark(#f7dfd5, #51352f); color: light-dark(#713c2d, #f5e7e0); }
    #semester-workbench-2026 .sw-shell &gt; .sw-stats &gt; .card:nth-child(3) .sw-stat-label { color: light-dark(#98624f, #e2b9aa); }
    #semester-workbench-2026 .sw-panel { display: grid; gap: 14px; }
    #semester-workbench-2026 .sw-panel[hidden] { display: none; }
    #semester-workbench-2026 .sw-controls { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    #semester-workbench-2026 .sw-field { display: grid; gap: 5px; min-width: 150px; }
    #semester-workbench-2026 .sw-grow { flex: 1 1 240px; }
    #semester-workbench-2026 .sw-section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    #semester-workbench-2026 .sw-section-head h2 { margin: 0; font-weight: 500; }
    #semester-workbench-2026 .sw-task-list { display: grid; gap: 7px; }
    #semester-workbench-2026 .sw-task { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    #semester-workbench-2026 .sw-task:last-child { border-bottom: 0; }
    #semester-workbench-2026 .sw-task label { cursor: pointer; }
    #semester-workbench-2026 .sw-task.is-done label { color: var(--muted-foreground); text-decoration: line-through; }
    #semester-workbench-2026 .sw-cat { color: var(--muted-foreground); white-space: nowrap; }
    #semester-workbench-2026 .sw-add { display: grid; grid-template-columns: minmax(160px,1fr) minmax(110px,150px) auto; gap: 8px; }
    #semester-workbench-2026 .sw-two { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(230px,.8fr); gap: 14px; align-items: start; }
    #semester-workbench-2026 .sw-metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    #semester-workbench-2026 .sw-metric { display: grid; gap: 5px; }
    #semester-workbench-2026 .sw-alert { padding: 10px 0; color: var(--muted-foreground); }
    #semester-workbench-2026 .sw-alert.is-risk { color: var(--destructive); }
    #semester-workbench-2026 .sw-alert.is-ok { color: var(--green); }
    #semester-workbench-2026 .sw-progress-label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    #semester-workbench-2026 .sw-table-wrap { overflow-x: auto; }
    #semester-workbench-2026 .sw-table { min-width: 720px; }
    #semester-workbench-2026 .sw-course-risk { color: var(--orange); }
    #semester-workbench-2026 .sw-milestones { display: grid; gap: 8px; }
    #semester-workbench-2026 .sw-milestone { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    #semester-workbench-2026 .sw-milestone:last-child { border-bottom: 0; }
    #semester-workbench-2026 .sw-empty { color: var(--muted-foreground); padding: 8px 0; }
    #semester-workbench-2026 .sw-plan-list { display: grid; gap: 0; }
    #semester-workbench-2026 .sw-plan-row { display: grid; grid-template-columns: 105px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); }
    #semester-workbench-2026 .sw-plan-row:last-child { border-bottom: 0; }
    #semester-workbench-2026 .sw-time { color: var(--muted-foreground); white-space: nowrap; }
    #semester-workbench-2026 .sw-class { color: var(--blue); }
    #semester-workbench-2026 .sw-study { color: var(--foreground); }
    #semester-workbench-2026 .sw-health { color: var(--green); }
    #semester-workbench-2026 .sw-schedule-table { min-width: 860px; }
    #semester-workbench-2026 .sw-day-cell { display: grid; gap: 5px; }
    #semester-workbench-2026 .sw-day-cell strong { font-weight: 500; }
    #semester-workbench-2026 textarea { resize: vertical; }
    @media (max-width: 680px) {
      #semester-workbench-2026 .sw-stats, #semester-workbench-2026 .sw-two { grid-template-columns: 1fr; }
      #semester-workbench-2026 .sw-add { grid-template-columns: 1fr; }
      #semester-workbench-2026 .sw-metrics { grid-template-columns: 1fr 1fr; }
      #semester-workbench-2026 .sw-milestone { grid-template-columns: 88px 1fr; }

      #semester-workbench-2026 .sw-plan-row .viz-badge { grid-column: 2; justify-self: start; }
